<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Jo Jung Ho — Rigging Artist." />
    <title>JO JUNG HO — Rigging Artist</title>
    <link rel="stylesheet" href="project.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <script type="module" src="hero-reels.js"></script>
    <script type="module" src="portfolio-content.js"></script>
    <script type="module" src="profile-content.js"></script>
  </head>
  <body>
    <header class="site-header site-header--home" aria-label="Main navigation">
      <nav class="main-nav">
        <a href="#portfolio">HOME</a>
        <a href="#featured">WORKS</a>
        <a href="#profile">PROFILE</a>
      </nav>
    </header>

    <main>
      <section class="hero page-section" id="portfolio" aria-labelledby="hero-title">
        <div class="hero__poster" aria-hidden="true"></div>
        <video class="hero__video" id="hero-video" data-hero-reel data-src="assets/videos/hero-reel.mp4" muted loop playsinline preload="none" aria-hidden="true"></video>
        <video class="hero__video" id="hero-video-2" data-hero-reel data-src="assets/videos/hero-reel-02.mp4" muted loop playsinline preload="none" aria-hidden="true"></video>
        <div class="hero__shade" aria-hidden="true"></div>

        <div class="hero__copy">
          <h1 id="hero-title">JO JUNG HO</h1>
          <p class="hero__role">RIGGING ARTIST</p>
        </div>

        <div class="hero-reels" role="group" aria-label="배경 영상 선택">
          <button class="hero-reels__button is-active" type="button" data-reel-index="0" aria-controls="hero-video" aria-pressed="true" aria-label="첫 번째 배경 영상 선택"><span class="hero-reels__number">01</span><span class="hero-reels__label">VIDEO</span><span class="hero-reels__line" aria-hidden="true"></span></button>
          <button class="hero-reels__button" type="button" data-reel-index="1" aria-controls="hero-video-2" aria-pressed="false" aria-label="두 번째 배경 영상 선택"><span class="hero-reels__number">02</span><span class="hero-reels__label">VIDEO</span><span class="hero-reels__line" aria-hidden="true"></span></button>
        </div>
        <p class="hero-reels__status" id="hero-reel-status" role="status"></p>

        <a class="scroll-cue" href="#featured" aria-label="Scroll to featured work">
          <span class="scroll-cue__mouse"><span></span></span>
          <span class="scroll-cue__label">SCROLL TO EXPLORE</span>
        </a>

        <nav class="section-steps" aria-label="Page sections">
          <a class="section-step is-active" href="#portfolio" data-step="portfolio" aria-current="location">
            <span class="section-step__dot"></span><span class="section-step__number">01</span><span class="section-step__label">PORTFOLIO</span>
          </a>
          <span class="section-steps__line" aria-hidden="true"></span>
          <a class="section-step" href="#featured" data-step="featured">
            <span class="section-step__dot"></span><span class="section-step__number">02</span><span class="section-step__label">WORKS</span>
          </a>
          <a class="section-step" href="#profile" data-step="profile">
            <span class="section-step__dot"></span><span class="section-step__number">03</span><span class="section-step__label">PROFILE</span>
          </a>
        </nav>
      </section>

      <section class="project-works project-works--tiles home-works page-section" id="featured" aria-labelledby="works-title">
        <div class="project-container">
          <div class="works-heading">
            <h2 id="works-title">WORKS</h2>
            <a class="works-manage" href="admin/?category=game-cinematic" data-local-video-manager hidden>영상 관리 <span aria-hidden="true">↗</span></a>
          </div>
          <div class="works-filters" role="group" aria-label="Works category" data-works-filters>
            <button type="button" data-work-filter="all" aria-pressed="true" aria-controls="home-works-grid">ALL</button>
            <button type="button" data-work-filter="showreel" aria-pressed="false" aria-controls="home-works-grid">ShowReel</button>
            <button type="button" data-work-filter="rigging" aria-pressed="false" aria-controls="home-works-grid">Rigging</button>
          </div>
          <div class="works-grid works-grid--video works-grid--filterable" id="home-works-grid" data-works-category="game-cinematic" data-homepage-works></div>
          <p class="works-empty" data-works-empty role="status" hidden>No works in this category yet.</p>
        </div>
        <nav class="section-steps" aria-label="Page sections">
          <a class="section-step" href="#portfolio" data-step="portfolio">
            <span class="section-step__dot"></span><span class="section-step__number">01</span><span class="section-step__label">PORTFOLIO</span>
          </a>
          <span class="section-steps__line" aria-hidden="true"></span>
          <a class="section-step is-active" href="#featured" data-step="featured" aria-current="location">
            <span class="section-step__dot"></span><span class="section-step__number">02</span><span class="section-step__label">WORKS</span>
          </a>
          <a class="section-step" href="#profile" data-step="profile">
            <span class="section-step__dot"></span><span class="section-step__number">03</span><span class="section-step__label">PROFILE</span>
          </a>
        </nav>
      </section>
      <section class="home-profile page-section" id="profile" aria-labelledby="profile-banner-title">
        <div class="home-profile__content">
          <div class="home-profile__intro">
            <p class="home-profile__eyebrow">03</p>
            <h2 id="profile-banner-title">PROFILE</h2>
            <p class="home-profile__specialty">Rigging, CFX</p>
            <p class="home-profile__summary">Rigging과 CFX 작업 경력 및 주요 프로젝트를 확인할 수 있습니다.</p>
            <a class="home-profile__action" href="projects/cloth-simulation.html">VIEW FULL PROFILE <span aria-hidden="true">↗</span></a>
          </div>
        </div>
        <nav class="section-steps" aria-label="Page sections">
          <a class="section-step" href="#portfolio" data-step="portfolio"><span class="section-step__dot"></span><span class="section-step__number">01</span><span class="section-step__label">PORTFOLIO</span></a>
          <span class="section-steps__line" aria-hidden="true"></span>
          <a class="section-step" href="#featured" data-step="featured"><span class="section-step__dot"></span><span class="section-step__number">02</span><span class="section-step__label">WORKS</span></a>
          <a class="section-step is-active" href="#profile" data-step="profile" aria-current="location"><span class="section-step__dot"></span><span class="section-step__number">03</span><span class="section-step__label">PROFILE</span></a>
        </nav>
      </section>
    </main>

  </body>
</html>
