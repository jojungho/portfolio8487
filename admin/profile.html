<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>프로필 편집 — JO JUNG HO</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="profile-editor.css" />
  <script type="module" src="profile-editor.js"></script>
</head>
<body>
  <header class="header"><a class="brand" href="../index.html">JO JUNG HO<span>PORTFOLIO MANAGER</span></a><div class="header-right"><a class="text-link" href="./">영상 관리</a><a class="text-link" href="../projects/cloth-simulation.html" target="_blank" rel="noopener">프로필 보기 ↗</a></div></header>
  <main class="workspace profile-workspace">
    <section class="page-heading"><div><p class="eyebrow">PROFILE & EXPERIENCE</p><h1>프로필 편집</h1><p class="intro">경력과 작품 이미지를 관리하세요. 이미지 위에 마우스를 올리면 중앙 타이틀을 미리 볼 수 있습니다.</p></div></section>
    <div class="profile-savebar"><p id="status" class="status" role="status">프로필을 불러오는 중입니다.</p><div class="heading-actions"><button type="button" id="reload-profile" class="button button-secondary" disabled>새로 불러오기</button><button type="submit" form="profile-form" id="save-profile" class="button button-primary" disabled>변경 저장</button></div></div>
    <form id="profile-form">
      <fieldset id="profile-fields" disabled>
        <details class="profile-basics"><summary>이름 · 전문 분야</summary><div class="field-pair"><label>이름<input id="profile-name" maxlength="100" required /></label><label>전문 분야<input id="profile-specialty" maxlength="200" /></label></div></details>
        <div class="profile-editor-layout">
          <aside class="career-sidebar"><p class="eyebrow">CAREER</p><label for="career-select">편집할 회사</label><select id="career-select"></select><button type="button" id="add-career" class="button button-secondary">＋ 경력 추가</button><p class="field-note">회사마다 경력 내용과 이미지 목록을 따로 편집할 수 있습니다.</p></aside>
          <section id="career-editor" class="career-editor" aria-label="경력 편집"></section>
        </div>
      </fieldset>
    </form>
    <input id="image-files" class="sr-only" type="file" accept="image/png,image/jpeg,image/webp" multiple aria-label="추가할 작품 이미지" />
    <input id="replacement-file" class="sr-only" type="file" accept="image/png,image/jpeg,image/webp" aria-label="교체할 작품 이미지" />
    <footer class="workspace-footer"><span>저장한 내용은 이 컴퓨터의 프로필에 반영됩니다. 공개 사이트에는 다시 배포하면 반영됩니다.</span><span>JO JUNG HO / PROFILE</span></footer>
  </main>
</body>
</html>
